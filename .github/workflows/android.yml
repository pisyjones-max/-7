name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: medvedokalipsis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Публикуем APK в релиз (ссылка для скачивания с телефона)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk stolovaya7.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest stolovaya7.apk --title "Столовая №7 — свежая сборка" --notes "Последняя сборка из main. Скачай stolovaya7.apk и установи." --latest
